<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5EF">
<meta name="description" content="Мир Гольфа — турниры, результаты и источники по гольфу в России и СНГ.">
<title>Мир Гольфа — турниры, результаты, источники</title>
<style>
  :root {
    --bg: #F4F5EF;
    --card: #FFFFFF;
    --ink: #182820;
    --muted: #6C776F;
    --green: #174D38;
    --lime: #D8F078;
    --line: #E0E5DC;
    --amber: #F3B94E;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 18px calc(92px + env(safe-area-inset-bottom));
  }
  a { color: inherit; }

  /* ── шапка ── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 0 12px;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 800;
    color: var(--muted);
  }
  .top h1 {
    margin: 2px 0 0;
    font-size: 26px;
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -.5px;
  }
  .logo {
    width: 48px; height: 48px;
    flex: 0 0 48px;
    border-radius: 16px;
    background: var(--lime);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  /* ── общие блоки ── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .hero {
    background: var(--green);
    color: #fff;
    border: 0;
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .hero .label {
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 800;
    color: var(--lime);
  }
  .hero h2 {
    margin: 8px 0 0;
    font-size: 23px;
    line-height: 1.22;
    font-weight: 900;
  }
  .hero p {
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: #E1E8DF;
  }
  .stats {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .stat {
    flex: 1;
    background: rgba(255,255,255,.10);
    border-radius: 14px;
    padding: 10px;
  }
  .stat b { display: block; font-size: 21px; font-weight: 900; }
  .stat span { font-size: 11px; color: #E1E8DF; }

  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .wrap-row { flex-wrap: wrap; }

  .pill {
    display: inline-block;
    background: #E8EDE3;
    color: var(--green);
    font-size: 11px;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 30px;
  }
  .pill.dark { background: var(--green); color: #fff; }
  .pill.warn { background: #FDF1D6; color: #8A5B00; }
  .pill.lime { background: var(--lime); color: var(--ink); }

  /* ── поиск и фильтры ── */
  .search {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 13px 15px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 10px;
    outline: none;
  }
  .search:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23,77,56,.10); }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 12px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 0;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    padding: 8px 13px;
    border-radius: 30px;
    background: #E8EDE3;
    color: var(--green);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--green); color: #fff; }
  .filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .filters select {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 11px 12px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  /* ── карточка турнира ── */
  .event {
    display: block;
    text-decoration: none;
    transition: transform .08s ease, box-shadow .12s ease;
  }
  .event:active { transform: scale(.99); }
  .event h3 {
    margin: 10px 0 8px;
    font-size: 18px;
    line-height: 1.25;
    font-weight: 900;
  }
  .event .when { color: var(--green); font-weight: 800; font-size: 14px; margin-bottom: 4px; }
  .event .where { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .event .more { font-size: 12px; font-weight: 800; color: var(--green); }
  .note-warn {
    margin-top: 10px;
    background: #FDF1D6;
    color: #8A5B00;
    border-radius: 12px;
    padding: 9px 11px;
    font-size: 12px;
    line-height: 1.4;
  }

  /* ── детальный экран ── */
  .back {
    display: inline-block;
    text-decoration: none;
    font-weight: 800;
    color: var(--green);
    margin: 0 0 14px;
    font-size: 14px;
  }
  .detail-hero {
    background: var(--green);
    color: #fff;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 12px;
  }
  .detail-hero h2 { margin: 12px 0 0; font-size: 24px; line-height: 1.2; font-weight: 900; }
  .detail-hero .when, .detail-hero .where { color: #E3EBDD; font-size: 14px; margin-top: 10px; }
  .detail-hero .where { margin-top: 4px; }
  .card h4 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card p + p { margin-top: 6px; }
  .btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    border: 0;
    font: inherit;
    font-weight: 900;
    font-size: 15px;
    padding: 15px;
    border-radius: 15px;
    background: var(--lime);
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn.ghost {
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
  }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { text-align: right; font-weight: 700; }

  /* ── аналитика ── */
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
  .bar-row .name { flex: 0 0 96px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 9px; background: #EDF1E8; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--green); border-radius: 99px; }
  .bar-row .val { flex: 0 0 24px; text-align: right; font-weight: 800; }

  /* ── источники ── */
  .src { display: block; text-decoration: none; }
  .src .idx { font-size: 10px; letter-spacing: 1px; font-weight: 800; color: var(--green); }
  .src h3 { margin: 6px 0 4px; font-size: 16px; font-weight: 900; line-height: 1.25; }
  .src .meta { font-size: 12px; color: var(--muted); }
  .src .st { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--green); }
  .trust { letter-spacing: 1px; color: var(--amber); }

  /* ── таббар ── */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(244,245,239,.94);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-around;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .tabbar a {
    flex: 1;
    max-width: 160px;
    text-decoration: none;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 0;
    border-radius: 12px;
  }
  .tabbar a .ic { display: block; font-size: 19px; line-height: 1.2; }
  .tabbar a[aria-current="page"] { color: var(--green); font-weight: 900; }

  .foot { font-size: 11px; line-height: 1.5; color: var(--muted); margin: 14px 0 0; }
  .empty { text-align: center; padding: 34px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">GOLF • CIS</div>
      <h1>Мир Гольфа</h1>
    </div>
    <div class="logo" aria-hidden="true">⛳</div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Разделы">
    <a href="#/tournaments" data-tab="tournaments"><span class="ic" aria-hidden="true">▦</span>Турниры</a>
    <a href="#/analytics" data-tab="analytics"><span class="ic" aria-hidden="true">⌁</span>Аналитика</a>
    <a href="#/sources" data-tab="sources"><span class="ic" aria-hidden="true">◎</span>Источники</a>
  </nav>
</div>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     Данные. Одна копия — вместо трёх (App.js, main.py, sources.json).
     Когда у API появится CORS, этот блок заменяется на fetch('/tournaments').
     ══════════════════════════════════════════════════════════ */

  var DATA_UPDATED = null; // дата ручной сверки, пока не подтверждена

  var EVENTS = [
    {
      id: 'ru-mini-2026',
      name: 'Кубок России по мини-гольфу',
      sport: 'Мини-гольф',
      dates: '2–9 ноября 2026',

      end: '2026-11-09',
      location: 'Санкт-Петербург · СШОР «Невские звёзды»',
      region: 'Санкт-Петербург',
      country: 'Россия',
      level: 'Всероссийский',
      declaredStatus: 'Предстоит',
      organizer: 'Ассоциация гольфа России',
      source: 'https://rusgolf.ru/ru/contests/tournament-calendar',
      note: 'Дата и площадка указаны в календаре АГР; перед поездкой проверьте актуальный регламент у организатора.'
    },
    {
      id: 'kr-krai-2026',
      name: 'Чемпионат Краснодарского края по гольфу',
      sport: 'Гольф',
      dates: '5–8 ноября 2026',
      start: '2026-11-05',
      end: '2026-11-08',
      location: 'Краснодарский край · «Геленджик гольф резорт»',
      region: 'Краснодарский край',
      country: 'Россия',
      level: 'Региональный',
      declaredStatus: 'Предстоит',
      organizer: 'Краснодарская краевая федерация развития гольфа',
      source: 'https://rusgolf.ru/ru/contests/tournament-calendar',
      note: 'Информация взята из календаря АГР; условия участия могут уточняться организатором.'
    },
    {
      id: 'belarus-open-2026',
      name: 'XX Belarus Golf Open Cup',
      sport: 'Гольф',
      dates: '19–20 сентября 2026',
      start: '2026-09-19',
      end: '2026-09-20',
      location: 'Беларусь · Минск',
      region: 'Беларусь',
      country: 'Беларусь',
      level: 'Международный',
      declaredStatus: 'Завершён',
      organizer: 'Белорусская ассоциация гольфа',
      source: 'https://ingolf.by/turniryi/kalendarnyij-plan-na-2026',
      note: 'Победитель намеренно не указан: его нужно подтвердить официальным протоколом.'
    }
  ];

  var SOURCES = [
    { name: 'Ассоциация гольфа России', country: 'Россия', type: 'Официальный календарь турниров', url: 'https://rusgolf.ru/ru/contests/tournament-calendar', status: 'Настроен · сбор ещё не запущен', trust: 5, auto: false },
    { name: 'Документы и положения АГР', country: 'Россия', type: 'Регламенты и требования к участию', url: 'https://rusgolf.ru/ru/contests/sorevnovaniya-2026', status: 'Настроен · сбор ещё не запущен', trust: 5, auto: false },
    { name: 'Федерация гольфа в г. Москве', country: 'Москва', type: 'Чемпионат Москвы, Первенство, Московский тур', url: 'https://mos-golf.ru/', status: 'Добавлен · автоматический сбор не запущен', trust: 5, auto: false },
    { name: 'Москомспорт — календарь гольфа', country: 'Москва', type: 'Городские турниры, положения, расписания и протоколы', url: 'https://golf.mossport.ru/', status: 'Добавлен · проверять документы по турнирам', trust: 5, auto: false },
    { name: 'Гольф.ру — календарь любительских турниров', country: 'Санкт-Петербург', type: 'Клубные и любительские турниры', url: 'https://golf.ru/when_play/lubitelskie/', status: 'Добавлен · агрегатор, нужна проверка у организатора', trust: 3, auto: false },
    { name: 'Федерация гольфа Московской области', country: 'Московская область', type: 'Первенство, чемпионат и региональный календарь', url: 'https://mofrg.ru/competitions/calendar/', status: 'Добавлен · автоматический сбор не запущен', trust: 5, auto: false },
    { name: 'АГР — турниры Краснодарского края', country: 'Краснодарский край', type: 'Чемпионат края и турниры в Геленджике', url: 'https://rusgolf.ru/ru/contests/tournament-calendar', status: 'Добавлен · даты требуют регулярной проверки', trust: 5, auto: false },
    { name: 'Красноярская федерация гольфа', country: 'Красноярский край', type: 'Краевой календарь, новости и юниорские соревнования', url: 'https://krasgolf.ru/', status: 'Добавлен · календарь сезона проверять по году', trust: 5, auto: false },
    { name: 'Казахстанская федерация гольфа — турниры Астаны', country: 'Астана', type: 'Кубок Астаны и Astana Championship Tour', url: 'https://fedgolf.kz/ru', status: 'Добавлен · старые сезоны требуют проверки', trust: 4, auto: false },
    { name: 'Livescoring.ru — результаты турниров', country: 'Россия и СНГ', type: 'История турниров и онлайн-счёт', url: 'https://livescoring.ru/history/', status: 'Добавлен · результаты подтверждать протоколом', trust: 3, auto: false },
    { name: 'Белорусская ассоциация гольфа', country: 'Беларусь', type: 'Календарь соревнований', url: 'https://ingolf.by/turniryi/kalendarnyij-plan-na-2026', status: 'Настроен · календарь может уточняться', trust: 5, auto: false },
    { name: 'Казахстанская федерация гольфа', country: 'Казахстан', type: 'Турниры, новости и регистрация', url: 'https://fedgolf.kz/ru', status: 'Добавлен · даты сезона проверять вручную', trust: 4, auto: false },
    { name: 'UZGolf', country: 'Узбекистан', type: 'Турниры и архив результатов', url: 'https://uzgolf.uz/en/events-en/', status: 'Добавлен · архив требует проверки актуальности', trust: 3, auto: false },
    { name: 'World Amateur Golf Ranking (WAGR)', country: 'Международный', type: 'Рейтинг любительских игроков', url: 'https://www.wagr.com/', status: 'Добавлен · проверить условия автоматического доступа', trust: 4, auto: false }
  ];

  /* ══════════════════════════════════════════════════════════
     Состояние
     ══════════════════════════════════════════════════════════ */

  var state = {
    tab: 'tournaments',
    eventId: null,
    q: '',
    sport: 'Все',
    region: 'Все',
    level: 'Все',
    onlySaved: false,
    sort: 'date',
    sourceCountry: 'Все',
    sourceQ: ''
  };

  var saved = loadSaved();

  function loadSaved() {
    try {
      var raw = localStorage.getItem('mirgolf.saved');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function storeSaved() {
    try { localStorage.setItem('mirgolf.saved', JSON.stringify(saved)); } catch (e) {}
  }

  /* ══════════════════════════════════════════════════════════
     Утилиты
     ══════════════════════════════════════════════════════════ */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function parseISO(s) {
    var p = s.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  var TODAY = (function () {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  })();

  function daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
  }

  // статус считается из дат, а не берётся из текста
  function autoStatus(e) {
    var start = parseISO(e.start), end = parseISO(e.end);
    if (end < TODAY) return 'Завершён';
    if (start > TODAY) return 'Предстоит';
    return 'Идёт сейчас';
  }

  function statusConflict(e) {
    return e.declaredStatus !== autoStatus(e);
  }

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function monthName(iso) {
    var names = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
    return names[parseISO(iso).getMonth()];
  }

  function trustDots(n) {
    var out = '';
    for (var i = 1; i <= 5; i++) out += i <= n ? '●' : '○';
    return out;
  }

  function unique(list) {
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++) {
      if (!seen[list[i]]) { seen[list[i]] = 1; out.push(list[i]); }
    }
    return out;
  }

  /* ══════════════════════════════════════════════════════════
     Фильтрация
     ══════════════════════════════════════════════════════════ */

  function filteredEvents() {
    var q = state.q.trim().toLowerCase();
    var rows = EVENTS.filter(function (e) {
      if (state.sport !== 'Все' && e.sport !== state.sport) return false;
      if (state.region !== 'Все' && e.region !== state.region) return false;
      if (state.level !== 'Все' && e.level !== state.level) return false;
      if (state.onlySaved && saved.indexOf(e.id) === -1) return false;
      if (!q) return true;
      var hay = [e.name, e.location, e.region, e.country, e.organizer, e.level, e.sport, e.dates, e.start, e.end].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    rows.sort(function (a, b) {
      if (state.sort === 'name') return a.name.localeCompare(b.name, 'ru');
      if (a.start === b.start) return 0;
      return a.start < b.start ? -1 : 1;
    });
    return rows;
  }

  function filteredSources() {
    var q = state.sourceQ.trim().toLowerCase();
    return SOURCES.filter(function (s) {
      if (state.sourceCountry !== 'Все' && s.country !== state.sourceCountry) return false;
      if (!q) return true;
      return (s.name + ' ' + s.type + ' ' + s.country + ' ' + s.status).toLowerCase().indexOf(q) !== -1;
    });
  }

  /* ══════════════════════════════════════════════════════════
     Экраны
     ══════════════════════════════════════════════════════════ */

  function viewTournaments() {
    var rows = filteredEvents();
    var upcoming = EVENTS.filter(function (e) { return autoStatus(e) === 'Предстоит'; }).length;
    var live = EVENTS.filter(function (e) { return autoStatus(e) === 'Идёт сейчас'; }).length;

    var html = '';

    html += '<section class="hero">' +
      '<div class="label">ОБЗОР КАЛЕНДАРЯ</div>' +
      '<h2>Следи за игрой.<br>Не пропускай старт.</h2>' +
      '<p>Демо-версия: данные сверены с официальными источниками вручную, автоматический сбор ещё не включён.</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + EVENTS.length + '</b><span>' + plural(EVENTS.length, 'турнир', 'турнира', 'турниров') + '</span></div>' +
        '<div class="stat"><b>' + (upcoming + live) + '</b><span>' + (live ? 'идут и предстоят' : 'предстоит') + '</span></div>' +
        '<div class="stat"><b>' + SOURCES.length + '</b><span>' + plural(SOURCES.length, 'источник', 'источника', 'источников') + '</span></div>' +
      '</div>' +
    '</section>';

    html += '<input class="search" id="q" type="search" value="' + esc(state.q) + '" placeholder="Турнир, город, организатор, дата…" aria-label="Поиск по турнирам">';

    html += '<div class="chips" role="group" aria-label="Вид спорта">';
    ['Все', 'Гольф', 'Мини-гольф'].forEach(function (f) {
      html += '<button class="chip" data-sport="' + esc(f) + '" aria-pressed="' + (state.sport === f) + '">' + esc(f) + '</button>';
    });
    html += '<button class="chip" data-saved="1" aria-pressed="' + state.onlySaved + '">★ Избранное</button>';
    html += '</div>';

    html += '<div class="filters">' +
      '<select id="region" aria-label="Регион">' + options(unique(EVENTS.map(function (e) { return e.region; })), state.region, 'Все регионы') + '</select>' +
      '<select id="level" aria-label="Уровень">' + options(unique(EVENTS.map(function (e) { return e.level; })), state.level, 'Все уровни') + '</select>' +
      '<select id="sort" aria-label="Сортировка" style="grid-column: span 2">' +
        '<option value="date"' + (state.sort === 'date' ? ' selected' : '') + '>Сортировка: по дате</option>' +
        '<option value="name"' + (state.sort === 'name' ? ' selected' : '') + '>Сортировка: по названию</option>' +
      '</select>' +
    '</div>';

    html += '<div class="row between" style="margin-bottom:10px">' +
      '<h2 style="margin:0;font-size:19px;font-weight:900">Календарь</h2>' +
      '<span class="muted small">' + rows.length + ' ' + plural(rows.length, 'событие', 'события', 'событий') + '</span>' +
    '</div>';

    if (!rows.length) {
      html += '<div class="empty"><b>Ничего не нашлось</b>Попробуйте изменить запрос или сбросить фильтры.<br><br>' +
        '<button class="chip" data-reset="1">Сбросить фильтры</button></div>';
    } else {
      rows.forEach(function (e) { html += eventCard(e); });
    }

    html += '<p class="foot">Демо не является гарантией актуальности. Даты и статусы нужно перепроверять у организаторов перед регистрацией или поездкой.</p>';
    return html;
  }

  function options(list, current, allLabel) {
    var html = '<option value="Все"' + (current === 'Все' ? ' selected' : '') + '>' + esc(allLabel) + '</option>';
    list.forEach(function (v) {
      html += '<option value="' + esc(v) + '"' + (current === v ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    return html;
  }

  function eventCard(e) {
    var status = autoStatus(e);
    var conflict = statusConflict(e);
    var star = saved.indexOf(e.id) !== -1 ? ' ★' : '';

    var html = '<a class="card event" href="#/event/' + esc(e.id) + '">' +
      '<div class="row between">' +
        '<span class="pill">' + esc(e.sport) + '</span>' +
        '<span class="muted small">' + esc(e.level) + star + '</span>' +
      '</div>' +
      '<h3>' + esc(e.name) + '</h3>' +
      '<div class="when">◷ ' + esc(e.dates) + '</div>' +
      '<div class="where">⌖ ' + esc(e.location) + '</div>' +
      '<div class="row between">' +
        '<span class="pill ' + (conflict ? 'warn' : 'dark') + '">' + esc(status) + '</span>' +
        '<span class="more">Подробнее ↗</span>' +
      '</div>';

    if (conflict) {
      html += '<div class="note-warn">Статус в карточке устарел: указано «' + esc(e.declaredStatus) + '», по датам — «' + esc(status) + '». Нужна сверка с источником.</div>';
    }

    return html + '</a>';
  }

  function viewEvent(e) {
    var status = autoStatus(e);
    var conflict = statusConflict(e);
    var isSaved = saved.indexOf(e.id) !== -1;
    var diff = daysBetween(TODAY, parseISO(e.start));
    var human = '';

    if (status === 'Предстоит') {
      human = 'Старт через ' + diff + ' ' + plural(diff, 'день', 'дня', 'дней');
    } else if (status === 'Завершён') {
      human = 'Завершён ' + Math.abs(daysBetween(TODAY, parseISO(e.end))) + ' ' + plural(Math.abs(daysBetween(TODAY, parseISO(e.end))), 'день', 'дня', 'дней') + ' назад';
    } else {
      human = 'Идёт сейчас';
    }

    var html = '<a class="back" href="#/tournaments">← Все турниры</a>';

    html += '<div class="detail-hero">' +
      '<span class="pill dark" style="background:rgba(255,255,255,.16)">' + esc(e.sport) + ' · ' + esc(e.level) + '</span>' +
      '<h2>' + esc(e.name) + '</h2>' +
      '<div class="when">◷ ' + esc(e.dates) + '</div>' +
      '<div class="where">⌖ ' + esc(e.location) + '</div>' +
    '</div>';

    html += '<div class="card">' +
      '<h4>Статус и организатор</h4>' +
      '<div class="kv"><span>По датам</span><span>' + esc(status) + '</span></div>' +
      '<div class="kv"><span>В карточке</span><span>' + esc(e.declaredStatus) + '</span></div>' +
      '<div class="kv"><span>Отсчёт</span><span>' + esc(human) + '</span></div>' +
      '<div class="kv"><span>Организатор</span><span>' + esc(e.organizer || 'уточняется') + '</span></div>' +
      '<div class="kv"><span>Регион</span><span>' + esc(e.region) + '</span></div>' +
    '</div>';

    if (conflict) {
      html += '<div class="note-warn" style="margin-bottom:12px">Расхождение: в карточке «' + esc(e.declaredStatus) + '», по датам — «' + esc(status) + '». Статус не перезаписывается автоматически — его подтверждает первоисточник.</div>';
    }

    html += '<div class="card">' +
      '<h4>Важная заметка</h4>' +
      '<p>' + esc(e.note) + '</p>' +
      '<p class="small" style="margin-top:10px">Победитель, счёт и требования не добавляются без подтверждённого протокола.</p>' +
      '<p class="small" style="margin-top:6px">Дата проверки: ' + (DATA_UPDATED ? esc(DATA_UPDATED) : 'не указана') + '</p>' +
    '</div>';

    html += '<a class="btn" href="' + esc(e.source) + '" target="_blank" rel="noopener">Открыть первоисточник ↗</a>';
    html += '<button class="btn ghost" data-fav="' + esc(e.id) + '">' + (isSaved ? '★ В избранном' : '☆ Добавить в избранное') + '</button>';

    return html;
  }

  function viewAnalytics() {
    var total = EVENTS.length;
    var byMonth = {}, byRegion = {}, bySport = {}, byLevel = {};
    EVENTS.forEach(function (e) {
      byMonth[monthName(e.start)] = (byMonth[monthName(e.start)] || 0) + 1;
      byRegion[e.region] = (byRegion[e.region] || 0) + 1;
      bySport[e.sport] = (bySport[e.sport] || 0) + 1;
      byLevel[e.level] = (byLevel[e.level] || 0) + 1;
    });

    var conflicts = EVENTS.filter(statusConflict).length;
    var avgTrust = SOURCES.reduce(function (s, x) { return s + x.trust; }, 0) / SOURCES.length;
    var automated = SOURCES.filter(function (s) { return s.auto; }).length;
    var official = SOURCES.filter(function (s) { return s.trust === 5; }).length;

    var html = '<h2 style="margin:2px 0 8px;font-size:24px;font-weight:900">Аналитика</h2>' +
      '<p class="muted small" style="margin:0 0 16px">Считается по тем же данным, что и календарь. Никаких оценок и прогнозов — только то, что есть в реестре.</p>';

    html += '<div class="card"><h4>Качество данных</h4>' +
      '<div class="kv"><span>Турниров в демо</span><span>' + total + '</span></div>' +
      '<div class="kv"><span>Статус расходится с датами</span><span>' + conflicts + '</span></div>' +
      '<div class="kv"><span>С подтверждённой датой проверки</span><span>' + (DATA_UPDATED ? total : 0) + '</span></div>' +
      '<div class="kv"><span>Источников с автосбором</span><span>' + automated + ' из ' + SOURCES.length + '</span></div>' +
      '<p class="small" style="margin-top:10px">Пока автоматического сбора нет, любое расхождение — повод открыть первоисточник, а не править данные вручную.</p>' +
    '</div>';

    html += '<div class="card"><h4>Турниры по месяцам</h4>' + bars(byMonth) + '</div>';
    html += '<div class="card"><h4>По регионам</h4>' + bars(byRegion) + '</div>';
    html += '<div class="card"><h4>По видам спорта</h4>' + bars(bySport) + '</div>';
    html += '<div class="card"><h4>По уровню</h4>' + bars(byLevel) + '</div>';

    html += '<div class="card"><h4>Источники</h4>' +
      '<div class="kv"><span>Всего в реестре</span><span>' + SOURCES.length + '</span></div>' +
      '<div class="kv"><span>С максимальным доверием</span><span>' + official + '</span></div>' +
      '<div class="kv"><span>Среднее доверие</span><span>' + avgTrust.toFixed(1) + ' / 5</span></div>' +
      '<div class="kv"><span>Уникальных адресов</span><span>' + unique(SOURCES.map(function (s) { return s.url; })).length + '</span></div>' +
      '<p class="small" style="margin-top:10px">Адресов меньше, чем записей: часть регионов пока ссылается на общий календарь АГР. Это стоит развести на отдельные источники.</p>' +
    '</div>';

    html += '<p class="foot">Каркас для будущих отчётов: когда появятся результаты и протоколы, здесь добавятся победители, счёт и динамика по игрокам.</p>';
    return html;
  }

  function bars(map) {
    var keys = Object.keys(map);
    if (!keys.length) return '<p class="small">Нет данных</p>';
    var max = Math.max.apply(null, keys.map(function (k) { return map[k]; }));
    return keys.map(function (k) {
      var w = max ? Math.round(map[k] / max * 100) : 0;
      return '<div class="bar-row">' +
        '<span class="name" title="' + esc(k) + '">' + esc(k) + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%"></span></span>' +
        '<span class="val">' + map[k] + '</span>' +
      '</div>';
    }).join('');
  }

  function viewSources() {
    var rows = filteredSources();

    var html = '<h2 style="margin:2px 0 8px;font-size:24px;font-weight:900">Источники</h2>' +
      '<p class="muted small" style="margin:0 0 14px">Реестр ссылок: Москва, Санкт-Петербург, Московская область, Краснодарский и Красноярский края, Астана и национальные федерации. Автоматический ежедневный сбор ещё не запущен.</p>';

    html += '<input class="search" id="sq" type="search" value="' + esc(state.sourceQ) + '" placeholder="Название, страна, тип…" aria-label="Поиск по источникам">';

    html += '<div class="chips" role="group" aria-label="Страна источника">';
    ['Все'].concat(unique(SOURCES.map(function (s) { return s.country; }))).forEach(function (c) {
      html += '<button class="chip" data-country="' + esc(c) + '" aria-pressed="' + (state.sourceCountry === c) + '">' + (c === 'Все' ? 'Все страны' : esc(c)) + '</button>';
    });
    html += '</div>';

    html += '<div class="row between" style="margin-bottom:10px"><span class="muted small">' + rows.length + ' ' + plural(rows.length, 'источник', 'источника', 'источников') + '</span></div>';

    if (!rows.length) {
      html += '<div class="empty"><b>Ничего не нашлось</b>Измените запрос или страну.</div>';
    } else {
      rows.forEach(function (s, i) {
        html += '<a class="card src" href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
          '<div class="idx">ИСТОЧНИК ' + String(i + 1).padStart(2, '0') + '</div>' +
          '<h3>' + esc(s.name) + '</h3>' +
          '<div class="meta">' + esc(s.country) + ' · <span class="trust" aria-label="Доверие ' + s.trust + ' из 5">' + trustDots(s.trust) + '</span> ' + s.trust + '/5</div>' +
          '<div class="meta" style="margin-top:4px">' + esc(s.type) + '</div>' +
          '<div class="st">' + esc(s.status) + ' · Открыть ↗</div>' +
        '</a>';
      });
    }

    html += '<p class="foot">Перед запуском сбора проверьте условия использования, robots.txt и наличие официального API/RSS у каждого сайта.</p>';
    return html;
  }

  /* ══════════════════════════════════════════════════════════
     Рендер и маршрутизация
     ══════════════════════════════════════════════════════════ */

  var view = document.getElementById('view');
  var tabbar = document.querySelector('.tabbar');

  function currentHash() {
    return (location.hash || '#/tournaments').replace(/^#\/?/, '');
  }

  function render(keepScroll) {
    var h = currentHash();

    if (h.indexOf('event/') === 0) {
      var id = h.slice(6);
      var e = EVENTS.filter(function (x) { return x.id === id; })[0];
      state.tab = 'tournaments';
      state.eventId = e ? id : null;
      view.innerHTML = e ? viewEvent(e) : '<div class="empty"><b>Турнир не найден</b><a class="back" href="#/tournaments">← К календарю</a></div>';
    } else {
      state.eventId = null;
      state.tab = ['tournaments', 'analytics', 'sources'].indexOf(h) !== -1 ? h : 'tournaments';
      view.innerHTML = state.tab === 'analytics' ? viewAnalytics()
        : state.tab === 'sources' ? viewSources()
        : viewTournaments();
    }

    var links = tabbar.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].dataset.tab === state.tab) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }

    if (!keepScroll) window.scrollTo(0, 0);
  }

  /* ══════════════════════════════════════════════════════════
     События интерфейса
     ══════════════════════════════════════════════════════════ */

  view.addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.q = e.target.value; rerenderList(); }
    else if (e.target.id === 'sq') { state.sourceQ = e.target.value; view.innerHTML = viewSources(); focusBack('sq'); }
  });

  view.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'region') { state.region = e.target.value; rerenderList(); }
    else if (id === 'level') { state.level = e.target.value; rerenderList(); }
    else if (id === 'sort') { state.sort = e.target.value; rerenderList(); }
  });

  view.addEventListener('click', function (e) {
    var t = e.target.closest('[data-sport],[data-saved],[data-reset],[data-country],[data-fav]');
    if (!t) return;

    if (t.dataset.sport) {
      state.sport = t.dataset.sport;
      rerenderList();
    } else if (t.dataset.saved) {
      state.onlySaved = !state.onlySaved;
      rerenderList();
    } else if (t.dataset.reset) {
      state.q = ''; state.sport = 'Все'; state.region = 'Все'; state.level = 'Все'; state.onlySaved = false;
      rerenderList();
    } else if (t.dataset.country) {
      state.sourceCountry = t.dataset.country;
      view.innerHTML = viewSources();
    } else if (t.dataset.fav) {
      var id = t.dataset.fav;
      var at = saved.indexOf(id);
      if (at === -1) saved.push(id); else saved.splice(at, 1);
      storeSaved();
      render(true);
    }
  });

  function focusBack(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.focus();
    var v = el.value;
    el.value = '';
    el.value = v;
  }

  // перерисовка списка без потери фокуса в поиске
  function rerenderList() {
    if (state.tab !== 'tournaments') { render(); return; }
    var q = document.getElementById('q');
    var sel = document.activeElement;
    var wasSearch = q && sel === q;
    var pos = wasSearch ? q.selectionStart : 0;
    view.innerHTML = viewTournaments();
    if (wasSearch) {
      var nq = document.getElementById('q');
      nq.focus();
      try { nq.setSelectionRange(pos, pos); } catch (err) {}
    }
  }

  window.addEventListener('hashchange', function () { render(); });

  render();
})();
</script>
</body>
</html>
