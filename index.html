<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5EF">
<meta name="description" content="Мир Гольфа — турниры, клубы, источники и архив по гольфу в России и СНГ.">
<title>Мир Гольфа — турниры, клубы, источники</title>
<style>
  :root {
    --bg: #F4F5EF;
    --card: #FFFFFF;
    --ink: #182820;
    --muted: #6C776F;
    --green: #174D38;
    --lime: #D8F078;
    --line: #E0E5DC;
    --amber: #F3B94E;
    --red: #B4472E;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 18px calc(96px + env(safe-area-inset-bottom));
  }
  a { color: inherit; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 0 10px;
  }
  .kicker { font-size: 11px; letter-spacing: 2px; font-weight: 800; color: var(--muted); }
  .top h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.1; font-weight: 900; letter-spacing: -.5px; }
  .logo {
    width: 48px; height: 48px; flex: 0 0 48px;
    border-radius: 16px; background: var(--lime);
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .databar { font-size: 11px; color: var(--muted); padding-bottom: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .hero { background: var(--green); color: #fff; border: 0; border-radius: 24px; padding: 18px; margin-bottom: 16px; }
  .hero .label { font-size: 11px; letter-spacing: 1.5px; font-weight: 800; color: var(--lime); }
  .hero h2 { margin: 8px 0 0; font-size: 23px; line-height: 1.22; font-weight: 900; }
  .hero p { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #E1E8DF; }
  .stats { display: flex; gap: 8px; margin-top: 14px; }
  .stat { flex: 1; background: rgba(255,255,255,.10); border-radius: 14px; padding: 10px; }
  .stat b { display: block; font-size: 20px; font-weight: 900; }
  .stat span { font-size: 10px; color: #E1E8DF; }

  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }

  .pill { display: inline-block; background: #E8EDE3; color: var(--green); font-size: 11px; font-weight: 800; padding: 6px 10px; border-radius: 30px; }
  .pill.dark { background: var(--green); color: #fff; }
  .pill.warn { background: #FDF1D6; color: #8A5B00; }
  .pill.err { background: #FBE4DE; color: #8C3320; }
  .pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }

  .search {
    width: 100%; background: var(--card); border: 1px solid var(--line);
    border-radius: 15px; padding: 13px 15px; font: inherit; font-size: 14px;
    color: var(--ink); margin-bottom: 10px; outline: none;
  }
  .search:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23,77,56,.10); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; font: inherit; font-size: 12px; font-weight: 800;
    padding: 8px 13px; border-radius: 30px; background: #E8EDE3; color: var(--green); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--green); color: #fff; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .filters select {
    width: 100%; font: inherit; font-size: 13px; padding: 11px 12px; border-radius: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }

  .event { display: block; text-decoration: none; }
  .event h3 { margin: 10px 0 8px; font-size: 18px; line-height: 1.25; font-weight: 900; }
  .event .when { color: var(--green); font-weight: 800; font-size: 14px; margin-bottom: 4px; }
  .event .where { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .event .more { font-size: 12px; font-weight: 800; color: var(--green); }
  .note-warn { margin-top: 10px; background: #FDF1D6; color: #8A5B00; border-radius: 12px; padding: 9px 11px; font-size: 12px; line-height: 1.4; }

  .back { display: inline-block; text-decoration: none; font-weight: 800; color: var(--green); margin: 0 0 14px; font-size: 14px; }
  .detail-hero { background: var(--green); color: #fff; border-radius: 24px; padding: 20px; margin-bottom: 12px; }
  .detail-hero h2 { margin: 12px 0 0; font-size: 24px; line-height: 1.2; font-weight: 900; }
  .detail-hero .when, .detail-hero .where { color: #E3EBDD; font-size: 14px; margin-top: 10px; }
  .detail-hero .where { margin-top: 4px; }
  .card h4 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card p + p { margin-top: 6px; }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none; border: 0;
    font: inherit; font-weight: 900; font-size: 15px; padding: 15px; border-radius: 15px;
    background: var(--lime); color: var(--ink); cursor: pointer; margin-bottom: 10px;
  }
  .btn.ghost { background: transparent; color: var(--green); border: 1px solid var(--green); }
  .btn.more-btn { background: var(--card); border: 1px solid var(--line); color: var(--green); font-size: 14px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { text-align: right; font-weight: 700; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
  .bar-row .name { flex: 0 0 104px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 9px; background: #EDF1E8; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--green); border-radius: 99px; }
  .bar-row .val { flex: 0 0 26px; text-align: right; font-weight: 800; }

  .src { display: block; text-decoration: none; }
  .idx { font-size: 10px; letter-spacing: 1px; font-weight: 800; color: var(--green); }
  .src h3, .club h3 { margin: 6px 0 4px; font-size: 16px; font-weight: 900; line-height: 1.25; }
  .src .meta, .club .meta { font-size: 12px; color: var(--muted); }
  .src .st, .club .st { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--green); }
  .club .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .club .links a { font-size: 12px; font-weight: 800; text-decoration: none; color: var(--green); background: #E8EDE3; padding: 7px 11px; border-radius: 30px; }
  .club .note, .src .note { margin: 9px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

  .check { display: block; text-decoration: none; }
  .check .url { font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 6px; }
  .check h3 { margin: 6px 0 2px; font-size: 14px; font-weight: 800; line-height: 1.3; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(244,245,239,.96); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 7px 4px calc(7px + env(safe-area-inset-bottom)); z-index: 10;
  }
  .tabbar a {
    flex: 1; text-decoration: none; text-align: center; color: var(--muted);
    font-size: 10px; font-weight: 700; padding: 3px 0; border-radius: 10px;
  }
  .tabbar a .ic { display: block; font-size: 18px; line-height: 1.2; }
  .tabbar a[aria-current="page"] { color: var(--green); font-weight: 900; }

  .foot { font-size: 11px; line-height: 1.5; color: var(--muted); margin: 14px 0 0; }
  .empty { text-align: center; padding: 34px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
  .section-title { font-size: 17px; font-weight: 900; margin: 18px 0 10px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">GOLF • CIS</div>
      <h1>Мир Гольфа</h1>
    </div>
    <div class="logo" aria-hidden="true">⛳</div>
  </header>
  <div class="databar" id="databar"></div>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Разделы">
    <a href="#/tournaments" data-tab="tournaments"><span class="ic" aria-hidden="true">▦</span>Турниры</a>
    <a href="#/clubs" data-tab="clubs"><span class="ic" aria-hidden="true">⛳</span>Клубы</a>
    <a href="#/sources" data-tab="sources"><span class="ic" aria-hidden="true">◎</span>Источники</a>
    <a href="#/archive" data-tab="archive"><span class="ic" aria-hidden="true">⌸</span>Архив</a>
    <a href="#/analytics" data-tab="analytics"><span class="ic" aria-hidden="true">⌁</span>Аналитика</a>
  </nav>
</div>

<script src="data/golf-data.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     Данные приходят из data/golf-data.js (window.GOLF).
     Внутри — выгрузка Golf_Sources_and_Clubs_CIS_2026.xlsx:
     183 источника, 85 клубов, 14 записей архива + проверка сайтов.
     Плюс турниры, разобранные с трёх официальных календарей.
     ══════════════════════════════════════════════════════════ */

  var G = window.GOLF || null;

  var EVENTS = (G && G.tournaments) || [];

  var SOURCES = (G && G.sources) || [];
  var CLUBS = (G && G.clubs) || [];
  var ARCHIVE = (G && G.archive) || [];
  var CHECKS = (G && G.checks) || [];
  var META = (G && G.meta) || {};
  var DATA_UPDATED = META.exported || null;
  var TOUR_EXTRACTED = META.tournamentsExtracted || null;

  var TYPE_LABEL = {
    club_site: 'сайт клуба', social_media: 'соцсеть', regional_sports_portal: 'региональный портал',
    regional_federation: 'региональная федерация', tournament_series: 'серия турниров',
    training_venue: 'тренировочная база', governing_body: 'федерация', scoring_platform: 'платформа результатов',
    official_calendar: 'официальный календарь', federation_registry: 'реестр федерации',
    course_directory: 'каталог полей', calendar_aggregator: 'агрегатор календаря',
    media: 'медиа', results_aggregator: 'агрегатор результатов', club_group: 'сеть клубов'
  };

  function typeLabel(t) { return TYPE_LABEL[t] || t || 'источник'; }

  /* ══════════════════════════════════════════════════════════
     Состояние
     ══════════════════════════════════════════════════════════ */

  var LIMIT = 24;

  var state = {
    tab: 'tournaments',
    eventId: null,
    q: '', sport: 'Все', source: 'Все', level: 'Все', onlySaved: false, upcomingOnly: false, sort: 'date',
    clubQ: '', clubCountry: 'Все',
    sourceQ: '', sourceCountry: 'Все', sourceType: 'Все',
    checkQ: '', checkState: 'Все',
    shownClubs: LIMIT, shownSources: LIMIT, shownChecks: LIMIT, shownArchive: LIMIT
  };

  var saved = loadSaved();

  function loadSaved() {
    try {
      var raw = localStorage.getItem('mirgolf.saved');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function storeSaved() {
    try { localStorage.setItem('mirgolf.saved', JSON.stringify(saved)); } catch (e) {}
  }

  /* ══════════════════════════════════════════════════════════
     Утилиты
     ══════════════════════════════════════════════════════════ */

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function parseISO(s) {
    var p = String(s).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  var TODAY = (function () {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  })();

  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  function autoStatus(e) {
    var start = parseISO(e.start), end = parseISO(e.end);
    if (end < TODAY) return 'Завершён';
    if (start > TODAY) return 'Предстоит';
    return 'Идёт сейчас';
  }

  function statusConflict(e) {
    if (!e.declaredStatus) return false;
    return e.declaredStatus !== autoStatus(e);
  }

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function monthName(iso) {
    var names = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
    return names[parseISO(iso).getMonth()];
  }

  function unique(list) {
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    }
    return out.sort(function (a, b) { return a.localeCompare(b, 'ru'); });
  }

  function countBy(list, key) {
    var out = {};
    list.forEach(function (x) {
      var k = typeof key === 'function' ? key(x) : x[key];
      if (k === undefined || k === null || k === '' || k === '—') return;
      out[k] = (out[k] || 0) + 1;
    });
    return out;
  }

  function isLink(u) { return typeof u === 'string' && /^https?:\/\//i.test(u); }

  function host(u) {
    var m = String(u).match(/^https?:\/\/([^\/]+)/i);
    return m ? m[1].replace(/^www\./, '') : String(u);
  }

  function checkState(code) {
    var c = String(code);
    if (c === 'FILE') return 'file';
    if (/^2/.test(c)) return 'ok';
    if (/^3/.test(c)) return 'redirect';
    if (/^4/.test(c)) return 'client';
    if (/^5/.test(c)) return 'server';
    return 'none';
  }

  var STATE_LABEL = { ok: 'доступен', redirect: 'редирект', client: 'ошибка 4xx', server: 'ошибка 5xx', none: 'нет ответа', file: 'документ' };

  function badgeClass(code) {
    var s = checkState(code);
    if (s === 'ok') return 'dark';
    if (s === 'redirect') return 'warn';
    if (s === 'client' || s === 'server') return 'err';
    return 'ghost';
  }

  function codeLabel(code) {
    if (String(code) === 'FILE') return 'документ';
    if (String(code) === '000') return 'нет ответа';
    return 'HTTP ' + code;
  }

  /* ══════════════════════════════════════════════════════════
     Турниры
     ══════════════════════════════════════════════════════════ */

  function filteredEvents() {
    var q = state.q.trim().toLowerCase();
    var rows = EVENTS.filter(function (e) {
      if (state.sport !== 'Все' && e.sport !== state.sport) return false;
      if (state.source !== 'Все' && sourceShort(e) !== state.source) return false;
      if (state.level !== 'Все' && e.level !== state.level) return false;
      if (state.upcomingOnly && autoStatus(e) === 'Завершён') return false;
      if (state.onlySaved && saved.indexOf(e.id) === -1) return false;
      if (!q) return true;
      return [e.name, e.location, e.region, e.country, e.organizer, e.level, e.sport, e.dates, e.start, e.end, e.sourceName]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
    rows.sort(function (a, b) {
      if (state.sort === 'name') return a.name.localeCompare(b.name, 'ru');
      if (state.sort === 'source') return String(a.sourceName).localeCompare(String(b.sourceName), 'ru');
      if (a.start === b.start) return 0;
      return a.start < b.start ? -1 : 1;
    });
    return rows;
  }

  function sourceShort(e) {
    return String(e.sourceName || 'источник').split(' · ')[0];
  }

  function viewTournaments() {
    var rows = filteredEvents();
    var upcoming = EVENTS.filter(function (e) { return autoStatus(e) === 'Предстоит'; }).length;
    var live = EVENTS.filter(function (e) { return autoStatus(e) === 'Идёт сейчас'; }).length;
    var srcList = unique(EVENTS.map(sourceShort));

    var html = '<section class="hero">' +
      '<div class="label">КАЛЕНДАРЬ 2026</div>' +
      '<h2>Следи за игрой.<br>Не пропускай старт.</h2>' +
      '<p>' + EVENTS.length + ' ' + plural(EVENTS.length, 'турнир', 'турнира', 'турниров') + ' разобраны с официальных календарей: ' +
        'АГР (Россия), Белорусская ассоциация гольфа и ГОЛЬФ.РУ. Данные сняты ' + (TOUR_EXTRACTED ? esc(TOUR_EXTRACTED) : 'вручную') + '.</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + EVENTS.length + '</b><span>' + plural(EVENTS.length, 'турнир', 'турнира', 'турниров') + '</span></div>' +
        '<div class="stat"><b>' + (upcoming + live) + '</b><span>предстоит и идёт</span></div>' +
        '<div class="stat"><b>' + CLUBS.length + '</b><span>' + plural(CLUBS.length, 'клуб', 'клуба', 'клубов') + '</span></div>' +
        '<div class="stat"><b>' + SOURCES.length + '</b><span>' + plural(SOURCES.length, 'источник', 'источника', 'источников') + '</span></div>' +
      '</div>' +
    '</section>';

    html += '<input class="search" id="q" type="search" value="' + esc(state.q) + '" placeholder="Турнир, место, организатор, дата…" aria-label="Поиск по турнирам">';

    html += '<div class="chips" role="group" aria-label="Вид спорта">';
    ['Все', 'Гольф', 'Мини-гольф'].forEach(function (f) {
      html += '<button class="chip" data-sport="' + esc(f) + '" aria-pressed="' + (state.sport === f) + '">' + esc(f) + '</button>';
    });
    html += '<button class="chip" data-saved="1" aria-pressed="' + state.onlySaved + '">★ Избранное</button>';
    html += '</div>';

    html += '<div class="chips" role="group" aria-label="Источник">';
    html += '<button class="chip" data-source="Все" aria-pressed="' + (state.source === 'Все') + '">Все источники</button>';
    srcList.forEach(function (s) {
      html += '<button class="chip" data-source="' + esc(s) + '" aria-pressed="' + (state.source === s) + '">' + esc(s) + '</button>';
    });
    html += '</div>';

    html += '<div class="filters">' +
      '<select id="level" aria-label="Уровень">' + options(unique(EVENTS.map(function (e) { return e.level; })), state.level, 'Все уровни') + '</select>' +
      '<select id="sort" aria-label="Сортировка">' +
        '<option value="date"' + (state.sort === 'date' ? ' selected' : '') + '>По дате</option>' +
        '<option value="name"' + (state.sort === 'name' ? ' selected' : '') + '>По названию</option>' +
        '<option value="source"' + (state.sort === 'source' ? ' selected' : '') + '>По источнику</option>' +
      '</select>' +
      '<button class="chip" data-upcoming="1" aria-pressed="' + state.upcomingOnly + '" style="grid-column: span 2">Только предстоящие</button>' +
    '</div>';

    html += '<div class="row between" style="margin-bottom:10px">' +
      '<h2 style="margin:0;font-size:19px;font-weight:900">Календарь</h2>' +
      '<span class="muted small">' + rows.length + ' ' + plural(rows.length, 'событие', 'события', 'событий') + '</span>' +
    '</div>';

    if (!EVENTS.length) {
      html += '<div class="empty"><b>Турниры не загружены</b>Файл data/golf-data.js не подключён или пуст.</div>';
    } else if (!rows.length) {
      html += '<div class="empty"><b>Ничего не нашлось</b>Попробуйте изменить запрос или сбросить фильтры.<br><br>' +
        '<button class="chip" data-reset="1">Сбросить фильтры</button></div>';
    } else {
      rows.forEach(function (e) { html += eventCard(e); });
    }

    html += '<p class="foot">Даты и статусы взяты с календарей организаторов и считаются по датам. Перед регистрацией или поездкой проверьте регламент у организатора: он может изменить сроки.</p>';
    return html;
  }

  function options(list, current, allLabel) {

        '<h2>' + esc(e.name) + '</h2>' +

    return html;

  /* ══════════════════════════════════════════════════════════

  function filteredSources() {
    var q = state.sourceQ.trim().toLowerCase();
    return SOURCES.filter(function (s) {
      if (state.sourceCountry !== 'Все' && s.country !== state.sourceCountry) return false;
      if (state.sourceType !== 'Все' && s.type !== state.sourceType) return false;
      if (!q) return true;
      return [s.name, s.country, s.region, s.type, s.roles, s.owner, s.status, s.url, s.note].join(' ').toLowerCase().indexOf(q) !== -1;
    });

  function statusPill(status) {
    if (/перепровер/i.test(status)) return 'warn';
    if (/проверена/i.test(status)) return 'dark';
    return 'ghost';

  function viewSources() {
    var rows = filteredSources();
    var types = unique(SOURCES.map(function (s) { return s.type; }));

      html += '<button class="chip" data-country="' + esc(c) + '" aria-pressed="' + (state.sourceCountry === c) + '">' + (c === 'Все' ? 'Все страны' : esc(c)) + '</button>';

      '<h3>' + esc(s.name) + '</h3>' +

      '<div class="meta" style="margin-top:4px">' + esc(s.channel || 'Сайт') + ' · ' + esc(s.roles || '') + '</div>' +
      '<div class="st"><span class="pill ' + statusPill(s.status) + '" style="font-size:10px;padding:4px 8px">' + esc(s.status) + '</span></div>' +
      (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') +

  /* ══════════════════════════════════════════════════════════
     Архив и проверка доступности
     ══════════════════════════════════════════════════════════ */

  var checkIndex = null;

  function buildCheckIndex() {
    checkIndex = {};
    CHECKS.forEach(function (c) { checkIndex[c.url] = c; });
  }

  function checkFor(url) {
    if (!checkIndex) buildCheckIndex();
    return checkIndex[url] || null;
  }

  function filteredChecks() {
    var q = state.checkQ.trim().toLowerCase();
    return CHECKS.filter(function (c) {
      if (state.checkState !== 'Все' && checkState(c.code) !== state.checkState) return false;
      if (!q) return true;
      return [c.url, c.final, c.title, c.desc].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function viewArchive() {
    var ok = CHECKS.filter(function (c) { return checkState(c.code) === 'ok'; }).length;
    var redirect = CHECKS.filter(function (c) { return checkState(c.code) === 'redirect'; }).length;
    var err = CHECKS.filter(function (c) { var s = checkState(c.code); return s === 'client' || s === 'server'; }).length;
    var none = CHECKS.filter(function (c) { return checkState(c.code) === 'none'; }).length;
    var files = CHECKS.filter(function (c) { return checkState(c.code) === 'file'; }).length;

    var html = '<h2 style="margin:2px 0 8px;font-size:24px;font-weight:900">Архив</h2>' +
      '<p class="muted small" style="margin:0 0 14px">Исключённые домены и результат обхода сайтов из реестра: код ответа, заголовок и адрес после редиректов.</p>';

    html += '<div class="stats" style="margin-bottom:16px">' +
      '<div class="stat" style="background:#fff;border:1px solid var(--line)"><b style="color:var(--green)">' + ok + '</b><span style="color:var(--muted)">отвечают</span></div>' +
      '<div class="stat" style="background:#fff;border:1px solid var(--line)"><b style="color:#8A5B00">' + redirect + '</b><span style="color:var(--muted)">редирект</span></div>' +
      '<div class="stat" style="background:#fff;border:1px solid var(--line)"><b style="color:var(--red)">' + err + '</b><span style="color:var(--muted)">ошибки</span></div>' +
      '<div class="stat" style="background:#fff;border:1px solid var(--line)"><b style="color:var(--muted)">' + none + '</b><span style="color:var(--muted)">нет ответа</span></div>' +
    '</div>';
    if (files) html += '<p class="small muted" style="margin:-8px 0 14px">' + files + ' ' + plural(files, 'адрес', 'адреса', 'адресов') + ' — документ (PDF/DOCX), а не страница.</p>';

    // исключённые
    html += '<div class="section-title">Исключённые источники · ' + ARCHIVE.length + '</div>';
    if (!ARCHIVE.length) {
      html += '<p class="small muted">Нет записей.</p>';
    } else {
      ARCHIVE.forEach(function (a) {
        html += '<div class="card">' +
          '<div class="row between"><span class="idx">АРХИВ ' + String(a.n).padStart(2, '0') + '</span><span class="pill ghost" style="font-size:10px;padding:4px 8px">' + esc(a.category) + '</span></div>' +
          '<h3 style="margin:6px 0 4px;font-size:15px;font-weight:900">' + esc(a.name) + '</h3>' +
          '<div class="check"><span class="url">' + esc(a.url) + '</span></div>' +
          '<p class="note" style="margin:8px 0 0;font-size:12px;color:var(--muted)">' + esc(a.reason) + '</p>' +
        '</div>';
      });
    }

    // проверка сайтов
    var rows = filteredChecks();
    html += '<div class="section-title">Проверка сайтов · ' + CHECKS.length + '</div>';

    html += '<input class="search" id="chq" type="search" value="' + esc(state.checkQ) + '" placeholder="Домен, заголовок…" aria-label="Поиск по проверкам">';

    html += '<div class="chips" role="group" aria-label="Состояние сайта">';
    [['Все', 'Все'], ['ok', 'Отвечают'], ['redirect', 'Редирект'], ['client', '4xx'], ['server', '5xx'], ['none', 'Нет ответа']].forEach(function (p) {
      html += '<button class="chip" data-check="' + p[0] + '" aria-pressed="' + (state.checkState === p[0]) + '">' + p[1] + '</button>';
    });
    html += '</div>';

    if (!rows.length) {
      html += '<div class="empty"><b>Нет записей</b>Измените фильтр.</div>';
    } else {
      rows.slice(0, state.shownChecks).forEach(function (c) {
        html += '<a class="card check" href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
          '<div class="row between">' +
            '<span class="pill ' + badgeClass(c.code) + '" style="font-size:10px;padding:4px 8px">' + codeLabel(c.code) + '</span>' +
            '<span class="muted small">' + esc(host(c.url)) + '</span>' +

          '<h3>' + esc(c.title || (checkState(c.code) === 'none' ? 'Сайт не ответил' : 'Без заголовка')) + '</h3>' +
          (c.desc ? '<p class="note" style="margin:2px 0 0;font-size:12px;color:var(--muted)">' + esc(c.desc) + '</p>' : '') +
          '<div class="url">' + esc(c.url) + '</div>' +
          (c.final && c.final !== c.url ? '<div class="url">→ ' + esc(c.final) + '</div>' : '') +
        '</a>';
      });
      if (rows.length > state.shownChecks) {
        html += '<button class="btn more-btn" data-more="checks">Показать ещё (' + (rows.length - state.shownChecks) + ')</button>';
      }
    }

    html += '<p class="foot">Обход — разовая проверка главных страниц: код ответа и заголовок. Он не подтверждает актуальность дат турниров и не заменяет официальный протокол.</p>';
    return html;
  }

    html += '<div class="card"><h4>Турниры по источникам</h4>' + bars(byTourSource) +

      '<p class="small" style="margin-top:10px">Проверка главных страниц: ' + CHECKS.length + ' адресов. Ошибки и отсутствие ответа — повод заменить источник, а не удалять данные.</p></div>';

    html += '<div class="card"><h4>Источники по типу</h4>' + bars(mapLabels(byType, typeLabel)) + '</div>';
    html += '<div class="card"><h4>Статус проверки источников</h4>' + bars(byStatus) + '</div>';
    html += '<div class="card"><h4>Источники по странам</h4>' + bars(topN(byCountry, 8)) + '</div>';
    html += '<div class="card"><h4>Клубы по странам</h4>' + bars(topN(clubsByCountry, 8)) + '</div>';

    html += '<p class="foot">Когда появится сбор и протоколы, здесь добавятся победители, счёт и динамика по игрокам.</p>';
    return html;
  }

  function mapLabels(map, fn) {
    var out = {};
    Object.keys(map).forEach(function (k) { out[fn(k)] = map[k]; });
    return out;
  }

  function topN(map, n) {
    var keys = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; }).slice(0, n);
    var out = {};
    keys.forEach(function (k) { out[k] = map[k]; });
    return out;
  }

  function bars(map) {
    var keys = Object.keys(map);
    if (!keys.length) return '<p class="small">Нет данных</p>';
    var max = Math.max.apply(null, keys.map(function (k) { return map[k]; }));
    return keys.map(function (k) {
      var w = max ? Math.round(map[k] / max * 100) : 0;
      return '<div class="bar-row">' +
        '<span class="name" title="' + esc(k) + '">' + esc(k) + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%"></span></span>' +
        '<span class="val">' + map[k] + '</span>' +
      '</div>';
    }).join('');
  }

  /* ══════════════════════════════════════════════════════════
     Рендер и маршрутизация
     ══════════════════════════════════════════════════════════ */

  var view = document.getElementById('view');
  var tabbar = document.querySelector('.tabbar');
  var databar = document.getElementById('databar');

  var TABS = ['tournaments', 'clubs', 'sources', 'archive', 'analytics'];

  function currentHash() {
    return (location.hash || '#/tournaments').replace(/^#\/?/, '');
  }

  function render(keepScroll) {
    var h = currentHash();

    if (h.indexOf('event/') === 0) {
      var id = h.slice(6);
      var e = EVENTS.filter(function (x) { return x.id === id; })[0];
      state.tab = 'tournaments';
      state.eventId = e ? id : null;
      view.innerHTML = e ? viewEvent(e) : '<div class="empty"><b>Турнир не найден</b><a class="back" href="#/tournaments">← К календарю</a></div>';
    } else {
      state.eventId = null;
      state.tab = TABS.indexOf(h) !== -1 ? h : 'tournaments';
      if (state.tab === 'clubs') view.innerHTML = viewClubs();
      else if (state.tab === 'sources') view.innerHTML = viewSources();
      else if (state.tab === 'archive') view.innerHTML = viewArchive();
      else if (state.tab === 'analytics') view.innerHTML = viewAnalytics();
      else view.innerHTML = viewTournaments();
    }

    var links = tabbar.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].dataset.tab === state.tab) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }

    if (!keepScroll) window.scrollTo(0, 0);
  }

  function renderDataBar() {
    var parts = [];
    if (DATA_UPDATED) parts.push('выгрузка ' + DATA_UPDATED);
    if (EVENTS.length) parts.push(EVENTS.length + ' ' + plural(EVENTS.length, 'турнир', 'турнира', 'турниров'));
    if (SOURCES.length) parts.push(SOURCES.length + ' ' + plural(SOURCES.length, 'источник', 'источника', 'источников'));
    if (CLUBS.length) parts.push(CLUBS.length + ' ' + plural(CLUBS.length, 'клуб', 'клуба', 'клубов'));
    if (CHECKS.length) parts.push(CHECKS.length + ' ' + plural(CHECKS.length, 'проверенный адрес', 'проверенных адреса', 'проверенных адресов'));
    databar.textContent = parts.join(' · ') || 'данные не загружены';
  }

  /* ══════════════════════════════════════════════════════════
     События интерфейса
     ══════════════════════════════════════════════════════════ */

  function resetLimits(which) {
    if (which === 'clubs') state.shownClubs = LIMIT;
    else if (which === 'sources') state.shownSources = LIMIT;
    else if (which === 'checks') state.shownChecks = LIMIT;
  }

  function rerenderCurrent() {
    var el = document.activeElement;
    var focusId = el && el.id;
    var pos = focusId ? el.selectionStart : 0;
    render(true);
    if (focusId) {
      var again = document.getElementById(focusId);
      if (again) {
        again.focus();
        try { again.setSelectionRange(pos, pos); } catch (err) {}
      }
    }
  }

  view.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { state.q = e.target.value; rerenderCurrent(); }
    else if (id === 'cq') { state.clubQ = e.target.value; resetLimits('clubs'); rerenderCurrent(); }
    else if (id === 'sq') { state.sourceQ = e.target.value; resetLimits('sources'); rerenderCurrent(); }
    else if (id === 'chq') { state.checkQ = e.target.value; resetLimits('checks'); rerenderCurrent(); }
  });

  view.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'level') { state.level = e.target.value; rerenderCurrent(); }
    else if (id === 'sort') { state.sort = e.target.value; rerenderCurrent(); }
    else if (id === 'stype') { state.sourceType = e.target.value; resetLimits('sources'); rerenderCurrent(); }
  });

  view.addEventListener('click', function (e) {
    var t = e.target.closest('[data-sport],[data-source],[data-saved],[data-upcoming],[data-reset],[data-country],[data-club-country],[data-check],[data-more],[data-fav]');
    if (!t) return;

    if (t.dataset.sport !== undefined) { state.sport = t.dataset.sport; rerenderCurrent(); }
    else if (t.dataset.source !== undefined) { state.source = t.dataset.source; rerenderCurrent(); }
    else if (t.dataset.saved !== undefined) { state.onlySaved = !state.onlySaved; rerenderCurrent(); }
    else if (t.dataset.upcoming !== undefined) { state.upcomingOnly = !state.upcomingOnly; rerenderCurrent(); }
    else if (t.dataset.reset !== undefined) {
      state.q = ''; state.sport = 'Все'; state.source = 'Все'; state.level = 'Все'; state.onlySaved = false; state.upcomingOnly = false;
      rerenderCurrent();
    }
    else if (t.dataset.country !== undefined) { state.sourceCountry = t.dataset.country; resetLimits('sources'); rerenderCurrent(); }
    else if (t.dataset.clubCountry !== undefined) { state.clubCountry = t.dataset.clubCountry; resetLimits('clubs'); rerenderCurrent(); }
    else if (t.dataset.check !== undefined) { state.checkState = t.dataset.check; resetLimits('checks'); rerenderCurrent(); }
    else if (t.dataset.more) {
      if (t.dataset.more === 'clubs') state.shownClubs += LIMIT;
      else if (t.dataset.more === 'sources') state.shownSources += LIMIT;
      else if (t.dataset.more === 'checks') state.shownChecks += LIMIT;
      rerenderCurrent();
    }
    else if (t.dataset.fav) {
      var id = t.dataset.fav;
      var at = saved.indexOf(id);
      if (at === -1) saved.push(id); else saved.splice(at, 1);
      storeSaved();
      render(true);
    }
  });

  window.addEventListener('hashchange', function () { render(); });

  renderDataBar();
  render();
})();
</script>
</body>
</html>
